apiVersion: v1
kind: ServiceAccount
metadata:
  name: users-sa
  namespace: fcg-apps
  labels:
    app: users-api
  annotations:
    # Replace with `terraform output irsa_service_role_arns` value when deploying to EKS.
    eks.amazonaws.com/role-arn: ""
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: users-api
  namespace: fcg-apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: users-deployment
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
